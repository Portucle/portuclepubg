<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portucle - Oyuncu Portalı & Destek Sistemi</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100vh;
            color: #fff;
            background: linear-gradient(180deg, rgba(10, 15, 29, 0.9), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            padding-bottom: 50px;
        }

        /* Navigasyon Barı */
        nav {
            background: rgba(15, 20, 30, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.3rem; font-weight: bold; color: #ffb703; display: flex; align-items: center; gap: 8px; }
        .user-nav { display: flex; align-items: center; gap: 10px; }

        /* Tag / Badge Stilleri */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-kurucu { background: #e74c3c; color: #fff; box-shadow: 0 0 10px rgba(231, 76, 60, 0.6); }
        .badge-yonetici { background: #e67e22; color: #fff; box-shadow: 0 0 10px rgba(230, 126, 34, 0.6); }
        .badge-elit { background: #9b59b6; color: #fff; box-shadow: 0 0 10px rgba(155, 89, 182, 0.6); }
        .badge-oyuncu { background: #34495e; color: #fff; }

        /* Mobil Uyumlu Butonlar */
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            font-size: 0.95rem;
            touch-action: manipulation;
        }
        .btn-primary { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; font-weight: bold; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-danger { background: #e74c3c; }

        /* Konteyner Düzeni */
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card {
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* MOBİL ZOOM BUG'INI ENGELLEYEN INPUT DÜZENLEMESİ (Min 16px) */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px !important; /* iOS Otomatik Zoom Engelleme */
            outline: none;
            -webkit-appearance: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #ffb703;
        }

        /* Tab Yapısı */
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .tab-btn { flex: 1; background: none; border: none; color: #94a3b8; font-size: 1rem; font-weight: 600; cursor: pointer; padding: 10px; border-radius: 6px; text-align: center; }
        .tab-btn.active { color: #ffb703; background: rgba(255, 183, 3, 0.15); }

        /* Destek Talebi Kartları */
        .ticket-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ticket-author { font-weight: bold; color: #ffb703; display: flex; align-items: center; gap: 8px; }
        .ticket-body { margin-bottom: 12px; font-size: 0.95rem; color: #e2e8f0; line-height: 1.4; word-break: break-word; }
        .ticket-reply { background: rgba(255, 183, 3, 0.08); border-left: 3px solid #ffb703; padding: 10px; margin-top: 10px; border-radius: 6px; }
        .ticket-reply-author { font-size: 0.85rem; color: #ffb703; font-weight: bold; margin-bottom: 4px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <nav>
        <div class="logo"><i class="fa-solid fa-gamepad"></i> PORTUCLE</div>
        <div class="user-nav" id="userNav"></div>
    </nav>

    <div class="container">

        <!-- GİRİŞ VE KAYIT PANELİ -->
        <div id="authContainer" class="card">
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" onclick="switchAuthTab('login')">Giriş Yap</button>
                <button type="button" class="tab-btn" onclick="switchAuthTab('register')">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <form id="loginForm" action="javascript:void(0);" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card"></i> PUBG Mobile Oyuncu ID</label>
                    <input type="text" id="loginId" inputmode="numeric" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Örn: 51944248284" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Site Şifresi</label>
                    <input type="password" id="loginPassword" autocapitalize="none" autocorrect="off" placeholder="Şifrenizi giriniz" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
            </form>

            <!-- Kayıt Formu -->
            <form id="registerForm" class="hidden" action="javascript:void(0);" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card"></i> PUBG Mobile Oyuncu ID</label>
                    <input type="text" id="regId" inputmode="numeric" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Oyuncu ID'nizi giriniz" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> PUBG Mobile Oyuncu Adı</label>
                    <input type="text" id="regUsername" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Oyundaki kullanıcı adınız" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Site Şifresi</label>
                    <input type="password" id="regPassword" autocapitalize="none" autocorrect="off" placeholder="En az 4 karakter" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-shield-halved"></i> Şifre Onayla</label>
                    <input type="password" id="regPasswordConfirm" autocapitalize="none" autocorrect="off" placeholder="Şifrenizi tekrar giriniz" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</button>
            </form>
        </div>

        <!-- DESTEK TALEBİ OLUŞTURMA -->
        <div id="supportFormContainer" class="card hidden">
            <h2 style="color: #ffb703; margin-bottom: 15px; font-size: 1.2rem;"><i class="fa-solid fa-headset"></i> Destek Talebi Oluştur</h2>
            <form action="javascript:void(0);" onsubmit="handleCreateTicket(event)">
                <div class="form-group">
                    <label>Konu Seçiniz</label>
                    <select id="ticketSubject" required>
                        <option value="Klan Alımı">Klan Alımı</option>
                        <option value="Şikayet / Bildirim">Şikayet / Bildirim</option>
                        <option value="Öneri">Öneri</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Destek Mesajınız</label>
                    <textarea id="ticketMessage" rows="4" placeholder="Sorununuzu detaylıca açıklayın..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-paper-plane"></i> Talebi Gönder</button>
            </form>
        </div>

        <!-- KULLANICI TALEPLERİ -->
        <div id="myTicketsContainer" class="card hidden">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Taleplerim</h3>
            <div id="myTicketsList"></div>
        </div>

        <!-- YETKİLİ PANELİ -->
        <div id="adminTicketsContainer" class="card hidden">
            <h2 style="color: #e67e22; margin-bottom: 15px; font-size: 1.2rem;"><i class="fa-solid fa-user-shield"></i> Gelen Talepler (Yetkili)</h2>
            <div id="adminTicketsList"></div>
        </div>

        <!-- KURUCU TAG YÖNETİMİ -->
        <div id="tagManagementContainer" class="card hidden">
            <h2 style="color: #e74c3c; margin-bottom: 15px; font-size: 1.2rem;"><i class="fa-solid fa-crown"></i> Tag / Rol Yönetimi</h2>
            <form action="javascript:void(0);" onsubmit="handleAssignTag(event)">
                <div class="form-group">
                    <label>Oyuncu Seçiniz:</label>
                    <select id="tagUserSelect" required></select>
                </div>
                <div class="form-group">
                    <label>Verilecek Tag:</label>
                    <select id="tagRoleSelect" required>
                        <option value="Yönetici">Yönetici</option>
                        <option value="Elit">Elit</option>
                        <option value="Oyuncu">Oyuncu (Tagı Kaldır)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-check"></i> Tagı Güncelle</button>
            </form>
        </div>

    </div>

    <script>
        const KURUCU_ID = "51944248284";

        // Güvenli LocalStorage Erişimi (Gizli Sekme / Mobil Safari Düzeltmesi)
        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem(key)) || []; } 
            catch(e) { return []; }
        }
        function setStorage(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } 
            catch(e) { alert("Tarayıcı hafızasına erişilemedi (Gizli sekme modunu kapatın)."); }
        }

        let users = getStorage('portucle_users');
        let tickets = getStorage('portucle_tickets');
        let currentUser = getStorage('portucle_current_user');
        if (Array.isArray(currentUser)) currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderAppView();
        });

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        function handleRegister(e) {
            if(e) e.preventDefault();
            const id = document.getElementById('regId').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value;
            const passConfirm = document.getElementById('regPasswordConfirm').value;

            if (pass !== passConfirm) {
                alert("Şifreler eşleşmiyor!");
                return false;
            }

            if (users.some(u => String(u.id) === String(id))) {
                alert("Bu PUBG Mobile ID zaten kayıtlı!");
                return false;
            }

            let role = (String(id) === KURUCU_ID) ? 'Kurucu' : 'Oyuncu';

            const newUser = { id, username, password: pass, role };
            users.push(newUser);
            setStorage('portucle_users', users);

            alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
            switchAuthTab('login');
            document.getElementById('registerForm').reset();
            return false;
        }

        function handleLogin(e) {
            if(e) e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPassword').value;

            const user = users.find(u => String(u.id) === String(id) && u.password === pass);

            if (!user) {
                alert("Hatalı PUBG ID veya Şifre!");
                return false;
            }

            currentUser = user;
            setStorage('portucle_current_user', currentUser);
            document.getElementById('loginForm').reset();

            renderNav();
            renderAppView();
            return false;
        }

        function handleLogout() {
            currentUser = null;
            try { localStorage.removeItem('portucle_current_user'); } catch(e){}
            renderNav();
            renderAppView();
        }

        function handleCreateTicket(e) {
            if(e) e.preventDefault();
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketMessage').value.trim();

            const newTicket = {
                id: Date.now(),
                userId: currentUser.id,
                username: currentUser.username,
                subject: subject,
                message: message,
                status: 'Açık',
                reply: null,
                repliedBy: null
            };

            tickets.push(newTicket);
            setStorage('portucle_tickets', tickets);

            alert("Destek talebiniz gönderildi!");
            document.getElementById('ticketMessage').value = '';
            renderAppView();
            return false;
        }

        function handleReplyTicket(ticketId) {
            const replyInput = document.getElementById(`reply-input-${ticketId}`);
            const replyText = replyInput.value.trim();

            if (!replyText) {
                alert("Lütfen yanıt metni yazın!");
                return;
            }

            const ticketIndex = tickets.findIndex(t => t.id === ticketId);
            if (ticketIndex !== -1) {
                tickets[ticketIndex].reply = replyText;
                tickets[ticketIndex].status = 'Cevaplandı';
                tickets[ticketIndex].repliedBy = {
                    username: currentUser.username,
                    role: currentUser.role
                };

                setStorage('portucle_tickets', tickets);
                renderAppView();
            }
        }

        function handleAssignTag(e) {
            if(e) e.preventDefault();
            const selectedUserId = document.getElementById('tagUserSelect').value;
            const selectedRole = document.getElementById('tagRoleSelect').value;

            const userIndex = users.findIndex(u => String(u.id) === String(selectedUserId));
            if (userIndex !== -1) {
                users[userIndex].role = selectedRole;
                setStorage('portucle_users', users);

                if (currentUser && String(currentUser.id) === String(selectedUserId)) {
                    currentUser.role = selectedRole;
                    setStorage('portucle_current_user', currentUser);
                }

                alert(`Rol "${selectedRole}" olarak güncellendi.`);
                renderNav();
                renderAppView();
            }
            return false;
        }

        function renderNav() {
            const nav = document.getElementById('userNav');
            if (currentUser) {
                let badgeClass = getBadgeClass(currentUser.role);
                nav.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-weight: 600; font-size: 0.9rem;">${currentUser.username}</span>
                        <span class="badge ${badgeClass}">${currentUser.role}</span>
                    </div>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i></button>
                `;
            } else {
                nav.innerHTML = `<span style="color: #94a3b8; font-size: 0.85rem;"><i class="fa-solid fa-lock"></i> Giriş Yapın</span>`;
            }
        }

        function renderAppView() {
            const authContainer = document.getElementById('authContainer');
            const supportFormContainer = document.getElementById('supportFormContainer');
            const myTicketsContainer = document.getElementById('myTicketsContainer');
            const adminTicketsContainer = document.getElementById('adminTicketsContainer');
            const tagManagementContainer = document.getElementById('tagManagementContainer');

            authContainer.classList.add('hidden');
            supportFormContainer.classList.add('hidden');
            myTicketsContainer.classList.add('hidden');
            adminTicketsContainer.classList.add('hidden');
            tagManagementContainer.classList.add('hidden');

            if (!currentUser) {
                authContainer.classList.remove('hidden');
            } else {
                supportFormContainer.classList.remove('hidden');
                myTicketsContainer.classList.remove('hidden');
                renderMyTickets();

                if (['Kurucu', 'Yönetici', 'Elit'].includes(currentUser.role)) {
                    adminTicketsContainer.classList.remove('hidden');
                    renderAdminTickets();
                }

                if (currentUser.role === 'Kurucu') {
                    tagManagementContainer.classList.remove('hidden');
                    populateTagUserSelect();
                }
            }
        }

        function renderMyTickets() {
            const container = document.getElementById('myTicketsList');
            const myTickets = tickets.filter(t => String(t.userId) === String(currentUser.id));

            if (myTickets.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">Henüz destek talebiniz yok.</p>';
                return;
            }

            container.innerHTML = myTickets.map(t => `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <strong>${t.subject}</strong>
                        <span class="badge ${t.status === 'Cevaplandı' ? 'badge-elit' : 'badge-oyuncu'}">${t.status}</span>
                    </div>
                    <div class="ticket-body">${t.message}</div>
                    ${t.reply ? `
                        <div class="ticket-reply">
                            <div class="ticket-reply-author">
                                <i class="fa-solid fa-reply"></i> ${t.repliedBy.username} (${t.repliedBy.role})
                            </div>
                            <div>${t.reply}</div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderAdminTickets() {
            const container = document.getElementById('adminTicketsList');

            if (tickets.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">Destek talebi bulunmuyor.</p>';
                return;
            }

            container.innerHTML = tickets.map(t => `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <div class="ticket-author"><i class="fa-solid fa-user"></i> ${t.username}</div>
                        <span class="badge ${t.status === 'Cevaplandı' ? 'badge-elit' : 'badge-yonetici'}">${t.status}</span>
                    </div>
                    <div class="ticket-body">
                        <strong>Konu: ${t.subject}</strong><br>${t.message}
                    </div>
                    ${t.reply ? `
                        <div class="ticket-reply">
                            <div class="ticket-reply-author">Yanıtlayan: ${t.repliedBy.username}</div>
                            <div>${t.reply}</div>
                        </div>
                    ` : `
                        <div style="margin-top: 10px;">
                            <textarea id="reply-input-${t.id}" rows="2" placeholder="Yanıtınız..." style="margin-bottom: 8px;"></textarea>
                            <button class="btn btn-primary" style="width: 100%;" onclick="handleReplyTicket(${t.id})">Yanıtla</button>
                        </div>
                    `}
                </div>
            `).join('');
        }

        function populateTagUserSelect() {
            const select = document.getElementById('tagUserSelect');
            const otherUsers = users.filter(u => String(u.id) !== KURUCU_ID);

            if (otherUsers.length === 0) {
                select.innerHTML = '<option value="" disabled>Kayıtlı oyuncu yok</option>';
                return;
            }

            select.innerHTML = otherUsers.map(u => `
                <option value="${u.id}">${u.username} (${u.role})</option>
            `).join('');
        }

        function getBadgeClass(role) {
            switch(role) {
                case 'Kurucu': return 'badge-kurucu';
                case 'Yönetici': return 'badge-yonetici';
                case 'Elit': return 'badge-elit';
                default: return 'badge-oyuncu';
            }
        }
    </script>
</body>
</html>
