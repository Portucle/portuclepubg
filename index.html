<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portucle - Portal & Destek Sistemi</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            min-height: 100vh;
            color: #fff;
            background: linear-gradient(180deg, rgba(10, 15, 29, 0.9), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            padding-bottom: 50px;
        }

        /* Navigasyon Barı */
        nav {
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: #ffb703; display: flex; align-items: center; gap: 10px; }
        .user-nav { display: flex; align-items: center; gap: 15px; }

        /* Tag Stilleri */
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-kurucu { background: #e74c3c; color: #fff; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        .badge-yonetici { background: #e67e22; color: #fff; box-shadow: 0 0 10px rgba(230, 126, 34, 0.5); }
        .badge-elit { background: #9b59b6; color: #fff; box-shadow: 0 0 10px rgba(155, 89, 182, 0.5); }
        .badge-oyuncu { background: #34495e; color: #fff; }

        /* Butonlar */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
        }
        .btn-primary { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }

        /* Konteyner Düzeni */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: rgba(15, 20, 30, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Form Stilleri */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #ffb703;
            box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
        }

        /* Tab Yapısı */
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 1.1rem; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 6px; }
        .tab-btn.active { color: #ffb703; background: rgba(255, 183, 3, 0.1); }

        /* Destek Talebi Kartları */
        .ticket-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ticket-author { font-weight: bold; color: #ffb703; display: flex; align-items: center; gap: 10px; }
        .ticket-body { margin-bottom: 15px; font-size: 0.95rem; color: #e2e8f0; line-height: 1.5; }
        .ticket-reply { background: rgba(255, 183, 3, 0.05); border-left: 3px solid #ffb703; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .ticket-reply-author { font-size: 0.85rem; color: #ffb703; font-weight: bold; margin-bottom: 4px; }

        /* Gizleme Sınıfı */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ÜST MENÜ (NAVBAR) -->
    <nav>
        <div class="logo"><i class="fa-solid fa-gamepad"></i> PORTUCLE</div>
        <div class="user-nav" id="userNav">
            <!-- JavaScript ile Dinamik Doldurulacak -->
        </div>
    </nav>

    <div class="container">

        <!-- 1. GİRİŞ & KAYIT OLMA PANERİ (Giriş Yapılmadıysa Görünür) -->
        <div id="authContainer" class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchAuthTab('login')">Giriş Yap</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card"></i> PUBG Mobile Oyuncu ID</label>
                    <input type="text" id="loginId" placeholder="Örn: 51944248284" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Şifre</label>
                    <input type="password" id="loginPassword" placeholder="Şifrenizi giriniz" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
            </form>

            <!-- Kayıt Formu -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-card"></i> PUBG Mobile Oyuncu ID</label>
                    <input type="text" id="regId" placeholder="Oyuncu ID'nizi giriniz" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> PUBG Mobile Oyuncu Adı</label>
                    <input type="text" id="regUsername" placeholder="Oyundaki tam adınız" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Site Şifresi</label>
                    <input type="password" id="regPassword" placeholder="En az 4 karakter" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-shield-halved"></i> Site Şifresi Onayla</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Şifrenizi tekrar girin" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</button>
            </form>
        </div>

        <!-- 2. DESTEK TALEBİ OLUŞTURMA PANELİ (Üyeler İçin) -->
        <div id="supportFormContainer" class="card hidden">
            <h2 style="color: #ffb703; margin-bottom: 20px;"><i class="fa-solid fa-headset"></i> Destek Talebi Oluştur</h2>
            <form onsubmit="handleCreateTicket(event)">
                <div class="form-group">
                    <label>Konu Seçiniz</label>
                    <select id="ticketSubject" required>
                        <option value="Klan Alımı">Klan Alımı</option>
                        <option value="Şikayet / Bildirim">Şikayet / Bildirim</option>
                        <option value="Öneri">Öneri</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mesajınız</label>
                    <textarea id="ticketMessage" rows="5" placeholder="Destek almak istediğiniz konuyu detaylıca yazınız..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Talebi Gönder</button>
            </form>
        </div>

        <!-- 3. KULLANICININ KENDİ DESTEK TALEPLERİ -->
        <div id="myTicketsContainer" class="card hidden">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-clock-rotate-left"></i> Oluşturduğum Destek Talepleri</h3>
            <div id="myTicketsList"></div>
        </div>

        <!-- 4. YETKİLİ PANELİ - GELEN DESTEK TALEPLERİ (Kurucu, Yönetici, Elit Görür) -->
        <div id="adminTicketsContainer" class="card hidden">
            <h2 style="color: #e67e22; margin-bottom: 20px;"><i class="fa-solid fa-user-shield"></i> Gelen Destek Talepleri (Yetkili Paneli)</h2>
            <div id="adminTicketsList"></div>
        </div>

        <!-- 5. KURUCU PANELİ - TAG/ROL YÖNETİMİ (Sadece Kurucu Görür) -->
        <div id="tagManagementContainer" class="card hidden">
            <h2 style="color: #e74c3c; margin-bottom: 20px;"><i class="fa-solid fa-crown"></i> Yetkili & Tag Yönetim Paneli</h2>
            <p style="color: #94a3b8; margin-bottom: 15px;">Aşağıdan bir oyuncu seçip vermek istediğiniz tagı atayabilirsiniz:</p>
            
            <form onsubmit="handleAssignTag(event)">
                <div class="form-group">
                    <label>Oyuncu Seçiniz:</label>
                    <select id="tagUserSelect" required>
                        <!-- JavaScript ile Dolacak -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Verilecek Tag / Rol:</label>
                    <select id="tagRoleSelect" required>
                        <option value="Yönetici">Yönetici</option>
                        <option value="Elit">Elit</option>
                        <option value="Oyuncu">Oyuncu (Tagı Kaldır)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Tagı Güncelle</button>
            </form>
        </div>

    </div>

    <script>
        // --- SABİTLER VE BAŞLANGIÇ VERİLERİ ---
        const KURUCU_ID = "51944248284";

        // LocalStorage Verilerini Yükle
        let users = JSON.parse(localStorage.getItem('portucle_users')) || [];
        let tickets = JSON.parse(localStorage.getItem('portucle_tickets')) || [];
        let currentUser = JSON.parse(localStorage.getItem('portucle_current_user')) || null;

        // Sayfa Yüklendiğinde
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderAppView();
        });

        // --- SEKMELER ARASI GEÇİŞ (Giriş / Kayıt) ---
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        // --- KAYIT OLMA İŞLEMİ ---
        function handleRegister(e) {
            e.preventDefault();
            const id = document.getElementById('regId').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value;
            const passConfirm = document.getElementById('regPasswordConfirm').value;

            if (pass !== passConfirm) {
                alert("Girdiğiniz şifreler eşleşmiyor!");
                return;
            }

            if (users.some(u => u.id === id)) {
                alert("Bu PUBG Mobile ID zaten sistemde kayıtlı!");
                return;
            }

            // Eğer giren kişi Kurucu ID'sine sahipse otomatik Kurucu rolü ver
            let role = (id === KURUCU_ID) ? 'Kurucu' : 'Oyuncu';

            const newUser = { id, username, password: pass, role };
            users.push(newUser);
            localStorage.setItem('portucle_users', JSON.stringify(users));

            alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
            switchAuthTab('login');
            document.getElementById('registerForm').reset();
        }

        // --- GİRİŞ YAPMA İŞLEMİ ---
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPassword').value;

            const user = users.find(u => u.id === id && u.password === pass);

            if (!user) {
                alert("Hatalı PUBG Mobile ID veya Şifre!");
                return;
            }

            currentUser = user;
            localStorage.setItem('portucle_current_user', JSON.stringify(currentUser));
            document.getElementById('loginForm').reset();

            renderNav();
            renderAppView();
        }

        // --- ÇIKIŞ YAPMA İŞLEMİ ---
        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('portucle_current_user');
            renderNav();
            renderAppView();
        }

        // --- DESTEK TALEBİ OLUŞTURMA ---
        function handleCreateTicket(e) {
            e.preventDefault();
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketMessage').value.trim();

            const newTicket = {
                id: Date.now(),
                userId: currentUser.id,
                username: currentUser.username,
                subject: subject,
                message: message,
                status: 'Açık',
                reply: null,
                repliedBy: null
            };

            tickets.push(newTicket);
            localStorage.setItem('portucle_tickets', JSON.stringify(tickets));

            alert("Destek talebiniz başarıyla gönderildi!");
            document.getElementById('ticketMessage').value = '';
            renderAppView();
        }

        // --- YETKİLİ DESTEK TALEBİ YANITLAMA ---
        function handleReplyTicket(ticketId) {
            const replyInput = document.getElementById(`reply-input-${ticketId}`);
            const replyText = replyInput.value.trim();

            if (!replyText) {
                alert("Lütfen bir yanıt yazın!");
                return;
            }

            const ticketIndex = tickets.findIndex(t => t.id === ticketId);
            if (ticketIndex !== -1) {
                tickets[ticketIndex].reply = replyText;
                tickets[ticketIndex].status = 'Cevaplandı';
                tickets[ticketIndex].repliedBy = {
                    username: currentUser.username,
                    role: currentUser.role
                };

                localStorage.setItem('portucle_tickets', JSON.stringify(tickets));
                renderAppView();
            }
        }

        // --- KURUCU: TAG / ROL ATAMA ---
        function handleAssignTag(e) {
            e.preventDefault();
            const selectedUserId = document.getElementById('tagUserSelect').value;
            const selectedRole = document.getElementById('tagRoleSelect').value;

            const userIndex = users.findIndex(u => u.id === selectedUserId);
            if (userIndex !== -1) {
                users[userIndex].role = selectedRole;
                localStorage.setItem('portucle_users', JSON.stringify(users));

                // Eğer aktif kullanıcının yetkisi güncellendiyse oturumu güncelle
                if (currentUser && currentUser.id === selectedUserId) {
                    currentUser.role = selectedRole;
                    localStorage.setItem('portucle_current_user', JSON.stringify(currentUser));
                }

                alert(`Kullanıcının rolü başarıyla "${selectedRole}" olarak güncellendi.`);
                renderNav();
                renderAppView();
            }
        }

        // --- GÖRÜNÜM AYARLARI VE DİNAMİK YÜKLEME ---
        function renderNav() {
            const nav = document.getElementById('userNav');
            if (currentUser) {
                let badgeClass = getBadgeClass(currentUser.role);
                nav.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-user-gear"></i>
                        <span>${currentUser.username}</span>
                        <span class="badge ${badgeClass}">${currentUser.role}</span>
                    </div>
                    <button class="btn btn-danger" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i> Çıkış Yap</button>
                `;
            } else {
                nav.innerHTML = `
                    <span style="color: #94a3b8; font-size: 0.9rem;"><i class="fa-solid fa-lock"></i> Lütfen Giriş Yapın</span>
                `;
            }
        }

        function renderAppView() {
            const authContainer = document.getElementById('authContainer');
            const supportFormContainer = document.getElementById('supportFormContainer');
            const myTicketsContainer = document.getElementById('myTicketsContainer');
            const adminTicketsContainer = document.getElementById('adminTicketsContainer');
            const tagManagementContainer = document.getElementById('tagManagementContainer');

            // Tüm alanları gizle
            authContainer.classList.add('hidden');
            supportFormContainer.classList.add('hidden');
            myTicketsContainer.classList.add('hidden');
            adminTicketsContainer.classList.add('hidden');
            tagManagementContainer.classList.add('hidden');

            if (!currentUser) {
                // Giriş Yapılmamışsa
                authContainer.classList.remove('hidden');
            } else {
                // Giriş Yapılmışsa
                supportFormContainer.classList.remove('hidden');
                myTicketsContainer.classList.remove('hidden');
                renderMyTickets();

                // Yetkili Görünümü (Kurucu, Yönetici, Elit)
                if (['Kurucu', 'Yönetici', 'Elit'].includes(currentUser.role)) {
                    adminTicketsContainer.classList.remove('hidden');
                    renderAdminTickets();
                }

                // Kurucu Görünümü (Sadece Kurucu)
                if (currentUser.role === 'Kurucu') {
                    tagManagementContainer.classList.remove('hidden');
                    populateTagUserSelect();
                }
            }
        }

        // Kullanıcı Taleplerini Listele
        function renderMyTickets() {
            const container = document.getElementById('myTicketsList');
            const myTickets = tickets.filter(t => t.userId === currentUser.id);

            if (myTickets.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">Henüz oluşturulmuş bir destek talebiniz bulunmuyor.</p>';
                return;
            }

            container.innerHTML = myTickets.map(t => `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <strong>Konu: ${t.subject}</strong>
                        <span class="badge ${t.status === 'Cevaplandı' ? 'badge-elit' : 'badge-oyuncu'}">${t.status}</span>
                    </div>
                    <div class="ticket-body">${t.message}</div>
                    ${t.reply ? `
                        <div class="ticket-reply">
                            <div class="ticket-reply-author">
                                <i class="fa-solid fa-reply"></i> Yanıtlayan: ${t.repliedBy.username} 
                                <span class="badge ${getBadgeClass(t.repliedBy.role)}">${t.repliedBy.role}</span>
                            </div>
                            <div>${t.reply}</div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Yetkili Taleplerini Listele
        function renderAdminTickets() {
            const container = document.getElementById('adminTicketsList');

            if (tickets.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">Henüz hiç destek talebi gönderilmemiş.</p>';
                return;
            }

            container.innerHTML = tickets.map(t => `
                <div class="ticket-item">
                    <div class="ticket-header">
                        <div class="ticket-author">
                            <i class="fa-solid fa-user"></i> ${t.username} (ID: ${t.userId})
                        </div>
                        <span class="badge ${t.status === 'Cevaplandı' ? 'badge-elit' : 'badge-yonetici'}">${t.status}</span>
                    </div>
                    <div class="ticket-body">
                        <strong>Konu: ${t.subject}</strong><br>
                        ${t.message}
                    </div>
                    ${t.reply ? `
                        <div class="ticket-reply">
                            <div class="ticket-reply-author">
                                <i class="fa-solid fa-check-double"></i> Yanıtlayan: ${t.repliedBy.username} 
                                <span class="badge ${getBadgeClass(t.repliedBy.role)}">${t.repliedBy.role}</span>
                            </div>
                            <div>${t.reply}</div>
                        </div>
                    ` : `
                        <div style="margin-top: 10px;">
                            <textarea id="reply-input-${t.id}" rows="2" placeholder="Talebe yanıt yazın..." style="width: 100%; margin-bottom: 8px;"></textarea>
                            <button class="btn btn-primary" onclick="handleReplyTicket(${t.id})"><i class="fa-solid fa-reply"></i> Yanıtla ve Gönder</button>
                        </div>
                    `}
                </div>
            `).join('');
        }

        // Tag Seçim Menüsünü Doldur
        function populateTagUserSelect() {
            const select = document.getElementById('tagUserSelect');
            const otherUsers = users.filter(u => u.id !== KURUCU_ID); // Kurucu kendini değiştiremez

            if (otherUsers.length === 0) {
                select.innerHTML = '<option value="" disabled>Henüz başka kayıtlı kullanıcı yok</option>';
                return;
            }

            select.innerHTML = otherUsers.map(u => `
                <option value="${u.id}">${u.username} (ID: ${u.id}) - Mevcut Rol: [${u.role}]</option>
            `).join('');
        }

        // Yardımcı Fonksiyon: Rolüne Göre Badge Rengi
        function getBadgeClass(role) {
            switch(role) {
                case 'Kurucu': return 'badge-kurucu';
                case 'Yönetici': return 'badge-yonetici';
                case 'Elit': return 'badge-elit';
                default: return 'badge-oyuncu';
            }
        }
    </script>
</body>
</html>
