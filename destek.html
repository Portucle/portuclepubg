<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portucle - Official Website</title>
    <style>
        /* TNYBold Font Tanımlaması */
        @font-face {
            font-family: 'TNYBold';
            src: url('TNYBold.ttf') format('truetype'); /* TNYBold.ttf dosyanız varsa bu dizine atın */
            font-weight: bold;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* PUBG Mobile Arka Plan Görseli */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
        }

        /* Ana Başlık Alanı */
        .header {
            text-align: center;
            margin-top: 15vh;
        }

        .title {
            font-family: 'TNYBold', 'Impact', sans-serif;
            font-size: 5rem;
            letter-spacing: 4px;
            color: #f39c12;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.6), 3px 3px 5px #000;
            text-transform: uppercase;
        }

        /* Sağ Alt Alan (Owner, Sosyal Medya, Buton) */
        .bottom-right {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            background: rgba(0, 0, 0, 0.65);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .owner-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: #e74c3c;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(231, 76, 60, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
            width: 100%;
        }

        .social-link {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .social-link:hover {
            color: #f39c12;
            transform: translateX(-5px);
        }

        .support-btn {
            background-color: #27ae60;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            margin-top: 5px;
            text-align: center;
            width: 100%;
        }

        .support-btn:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        @media (max-width: 768px) {
            .title { font-size: 3rem; }
            .bottom-right { 
                position: relative; 
                right: 0; 
                bottom: 0; 
                align-items: center; 
                margin-top: auto;
            }
            .social-links { text-align: center; }
            .social-link:hover { transform: translateY(-2px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">PORTUCLE</h1>
    </div>

    <div class="bottom-right">
        <span class="owner-tag">REAL OWNER</span>
        
        <div class="social-links">
            <a href="https://www.youtube.com/@realportucle" target="_blank" class="social-link">YouTube: @realportucle</a>
            <a href="https://www.tiktok.com/@realportuclepm" target="_blank" class="social-link">TikTok: @realportuclepm</a>
        </div>

        <a href="destek.html" class="support-btn">Destek Talebi için Tıkla</a>
    </div>

</body>
</html>
